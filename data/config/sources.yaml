llm:
  provider: anthropic
  model: claude-sonnet-4-20250514
  api_key_env: ANTHROPIC_API_KEY
  max_concurrent: 5
  requests_per_minute: 50
  max_tokens: 4096
  temperature: 0.2

pipeline:
  score_batch_size: 40
  extract_batch_size: 12
  score_threshold: 5
  max_age_days: 7
  min_title_summary_chars: 20
  memory_weeks: 4

fetch:
  max_concurrent: 10
  timeout_seconds: 30
  user_agent: "late-show-briefing/1.0 (+https://github.com/chouhanaryan/late-show)"

deliver:
  reports_dir: data/reports
  email:
    enabled: false
    smtp_host: smtp.gmail.com
    smtp_port: 587
    from: ""
    to: []
    user_env: SMTP_USER
    pass_env: SMTP_PASS

keyword_blocklist:
  - sponsored
  - advertisement
  - giveaway
  - coupon
  - deal alert

