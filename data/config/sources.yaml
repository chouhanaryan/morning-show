llm:
  # anthropic (direct), openrouter, or openai. Model IDs below are Anthropic
  # API IDs; switch them to OpenRouter slugs (e.g. anthropic/claude-sonnet-5.5)
  # if you change provider.
  provider: anthropic
  # Pass 3 (synthesis). claude-opus-5-5 is the step up ($4/$20 per MTok vs
  # Sonnet's $2/$10) if you want stronger analysis.
  model: claude-sonnet-5-5
  # Cheaper model for mechanical JSON passes (scoring, extraction, thread
  # tracking). Falls back to model above if omitted.
  pass1_model: claude-haiku-4-5
  pass2_model: claude-haiku-4-5
  api_key_env: ANTHROPIC_API_KEY
  max_concurrent: 5
  requests_per_minute: 50
  # Covers Pass 3's adaptive thinking plus the ~5k-token briefing.
  max_tokens: 16000
  # Sampling only for the Haiku passes. Leave top-level `temperature` unset:
  # Sonnet 5.5 / Opus 5.5 reject non-default sampling parameters.
  pass1_temperature: 0.2
  pass2_temperature: 0.2
  # Pass 3 thinking depth: low | medium | high | xhigh | max.
  effort: high
  # Retry safety-classifier refusals on Anthropic's recommended fallback
  # model (security news can trip the cyber classifier).
  refusal_fallback: true
  # USD per million tokens, for the cost estimate in the report footer only.
  pricing:
    claude-sonnet-5-5: {input: 2.00, output: 10.00}
    claude-opus-5-5: {input: 4.00, output: 20.00}
    claude-haiku-4-5: {input: 1.00, output: 5.00}

pipeline:
  score_batch_size: 40
  extract_batch_size: 12
  score_threshold: 5
  # Of the articles scoring >= score_threshold, only the best max_extract go
  # on to extraction and the briefing (which uses ~25 items).
  max_extract: 80
  max_age_days: 7
  # After a missed run, stretch the window to cover the gap, up to this cap.
  max_catchup_days: 21
  min_title_summary_chars: 20
  memory_weeks: 4

fetch:
  max_concurrent: 10
  timeout_seconds: 30
  user_agent: "Mozilla/5.0 (compatible; Feedfetcher/1.0; +https://github.com/chouhanaryan/morning-show)"

deliver:
  reports_dir: data/reports
  email:
    enabled: true
    smtp_host: smtp.gmail.com
    smtp_port: 587
    from_env: SMTP_FROM
    to_env: SMTP_TO
    user_env: SMTP_USER
    pass_env: SMTP_PASS

keyword_blocklist:
  - sponsored
  - advertisement
  - giveaway
  - coupon
  - deal alert

